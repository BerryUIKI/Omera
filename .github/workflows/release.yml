name: Release Build & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag
        required: false
      qualification_only:
        description: Check production macOS signing without creating a release
        type: boolean
        default: true

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.qualification_only && format('qualification-{0}', github.ref_name) || (github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name) }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  QUALIFICATION_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.qualification_only }}

jobs:
  release-preflight:
    name: Validate release version and destination
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require synchronized package versions
        run: node scripts/bump-version.mjs --check
      - name: Require a matching main-integrated tag and mutable draft
        if: env.QUALIFICATION_ONLY != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
        run: node scripts/release-preflight.mjs check

  # ── macOS: Developer ID signing + notarization + Gatekeeper validation ──────
  build-macos:
    name: Build macOS (${{ matrix.arch_name }})
    needs: release-preflight
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch_name: aarch64
            args: --target aarch64-apple-darwin
            dmg_asset_name: Omera_macOS_aarch64.dmg

    runs-on: macos-latest

    env:
      APP_NAME: Omera
      OMERA_UPDATE_PUBLIC_KEY: ${{ vars.OMERA_UPDATE_PUBLIC_KEY }}
      RELEASE_TAG: >-
        ${{ github.event_name == 'workflow_dispatch'
            && inputs.tag_name
            || github.ref_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate embedded trust and signing custody
        shell: bash
        env:
          OMERA_UPDATE_SIGNING_KEY: ${{ secrets.OMERA_UPDATE_SIGNING_KEY }}
          OMERA_UPDATE_SIGNING_PASSWORD: ${{ secrets.OMERA_UPDATE_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          node scripts/update-signing.mjs check
          pnpm build
          cargo build -p omera --bin verify-update
          node scripts/update-signing.mjs preflight

      # ── Preflight: validate Developer ID certificate ─────────────────────────
      - name: Validate Developer ID certificate
        env:
          MAC_SIGNING_CERT_BASE64: ${{ secrets.MAC_SIGNING_CERT_BASE64 }}
          MAC_SIGNING_CERT_PASSWORD: ${{ secrets.MAC_SIGNING_CERT_PASSWORD }}
          MAC_SIGNING_IDENTITY: ${{ vars.MAC_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail

          for name in \
            MAC_SIGNING_CERT_BASE64 \
            MAC_SIGNING_CERT_PASSWORD \
            MAC_SIGNING_IDENTITY; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required value: $name"
              exit 1
            fi
          done

          certificate_path="$RUNNER_TEMP/developer-id.p12"
          certificate_pem="$RUNNER_TEMP/developer-id.pem"

          printf '%s' "$MAC_SIGNING_CERT_BASE64" |
            /usr/bin/base64 -D > "$certificate_path"

          openssl pkcs12 \
            -in "$certificate_path" \
            -clcerts \
            -nokeys \
            -passin env:MAC_SIGNING_CERT_PASSWORD \
            -out "$certificate_pem" \
            -legacy 2>/dev/null || \
          openssl pkcs12 \
            -in "$certificate_path" \
            -clcerts \
            -nokeys \
            -passin env:MAC_SIGNING_CERT_PASSWORD \
            -out "$certificate_pem"

          certificate_subject="$(
            openssl x509 \
              -in "$certificate_pem" \
              -noout \
              -subject \
              -nameopt RFC2253
          )"

          echo "Signing certificate: $certificate_subject"

          if [[ "$certificate_subject" != *"Developer ID Application:"* ]]; then
            echo "::error::The P12 does not contain a Developer ID Application certificate."
            exit 1
          fi

          if [[ "$certificate_subject" != *"$MAC_SIGNING_IDENTITY"* ]]; then
            echo "::error::The P12 identity does not match MAC_SIGNING_IDENTITY."
            exit 1
          fi

          if ! openssl pkcs12 \
            -in "$certificate_path" \
            -nocerts \
            -nodes \
            -passin env:MAC_SIGNING_CERT_PASSWORD \
            -legacy 2>/dev/null | \
            openssl pkey -noout >/dev/null 2>&1 && \
          ! openssl pkcs12 \
            -in "$certificate_path" \
            -nocerts \
            -nodes \
            -passin env:MAC_SIGNING_CERT_PASSWORD \
            2>/dev/null | \
            openssl pkey -noout >/dev/null 2>&1; then
            echo "::error::The P12 does not contain a usable private key."
            exit 1
          fi

          echo "Certificate validation passed."

      # ── Prepare App Store Connect API key ────────────────────────────────────
      - name: Prepare App Store Connect API key
        id: notarization
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          set -euo pipefail

          for name in \
            APPLE_API_KEY \
            APPLE_API_ISSUER \
            APPLE_API_KEY_CONTENT; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing notarization secret: $name"
              exit 1
            fi
          done

          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"

          printf '%s' "$APPLE_API_KEY_CONTENT" |
            /usr/bin/base64 -D > "$key_path"

          chmod 600 "$key_path"

          echo "key_path=$key_path" >> "$GITHUB_OUTPUT"

      # ── Build, sign, and notarize the application ────────────────────────────
      - name: Build, sign, and notarize the application
        uses: tauri-apps/tauri-action@v0
        env:
          # No release credentials or tag reach the action in qualification mode.
          GITHUB_TOKEN: ${{ env.QUALIFICATION_ONLY != 'true' && secrets.GITHUB_TOKEN || '' }}

          APPLE_CERTIFICATE: ${{ secrets.MAC_SIGNING_CERT_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MAC_SIGNING_CERT_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ vars.MAC_SIGNING_IDENTITY }}

          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ steps.notarization.outputs.key_path }}
        with:
          tagName: ${{ env.QUALIFICATION_ONLY != 'true' && env.RELEASE_TAG || '' }}
          releaseName: 'Omera ${{ env.RELEASE_TAG }}'
          releaseBody: 'See [CHANGELOG.md](CHANGELOG.md) for full release details.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # ── Notarize and staple the final DMG ────────────────────────────────────
      - name: Notarize and staple the final DMG
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ steps.notarization.outputs.key_path }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          dmg_files=(
            "target/${{ matrix.target }}/release/bundle/dmg/"*.dmg
            "src-tauri/target/${{ matrix.target }}/release/bundle/dmg/"*.dmg
          )

          if (( ${#dmg_files[@]} == 0 )); then
            echo "::error::No DMG files found."
            exit 1
          fi

          dmg_path="${dmg_files[0]}"
          echo "DMG path: $dmg_path"

          codesign --verify --strict --verbose=2 "$dmg_path"

          dmg_signature="$(
            codesign --display --verbose=4 "$dmg_path" 2>&1
          )"
          echo "$dmg_signature"

          if [[ "$dmg_signature" != *"Authority=Developer ID Application:"* ]]; then
            echo "::error::The DMG is not signed with Developer ID Application."
            exit 1
          fi

          if [[ "$dmg_signature" != *"Timestamp="* ]]; then
            echo "::error::The DMG signature has no secure timestamp."
            exit 1
          fi

          xcrun notarytool submit "$dmg_path" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait

          xcrun stapler staple "$dmg_path"
          xcrun stapler validate "$dmg_path"

      # ── Verify application and DMG ────────────────────────────────────────────
      - name: Verify application and DMG
        run: |
          set -euo pipefail
          shopt -s nullglob

          app_dirs=(
            "target/${{ matrix.target }}/release/bundle/macos/"*.app
            "src-tauri/target/${{ matrix.target }}/release/bundle/macos/"*.app
          )
          if (( ${#app_dirs[@]} == 0 )); then
            echo "::error::Could not locate built .app bundle"
            exit 1
          fi
          app_path="${app_dirs[0]}"

          dmg_files=(
            "target/${{ matrix.target }}/release/bundle/dmg/"*.dmg
            "src-tauri/target/${{ matrix.target }}/release/bundle/dmg/"*.dmg
          )
          if (( ${#dmg_files[@]} == 0 )); then
            echo "::error::No DMG files found."
            exit 1
          fi
          dmg_path="${dmg_files[0]}"

          echo "=== Verifying .app: $app_path ==="
          echo "=== Verifying DMG: $dmg_path ==="
          codesign --verify --deep --strict --verbose=2 "$app_path"
          codesign --verify --strict --verbose=2 "$dmg_path"

          app_signature="$(
            codesign --display --verbose=4 "$app_path" 2>&1
          )"
          echo "$app_signature"

          if [[ "$app_signature" == *"Signature=adhoc"* ]]; then
            echo "::error::The app has an ad-hoc signature."
            exit 1
          fi

          if [[ "$app_signature" != *"Authority=Developer ID Application:"* ]]; then
            echo "::error::The app does not use Developer ID Application."
            exit 1
          fi

          if [[ "$app_signature" != *"Timestamp="* ]]; then
            echo "::error::The app signature has no secure timestamp."
            exit 1
          fi

          if [[ "$app_signature" == *"TeamIdentifier=not set"* ]]; then
            echo "::error::The app signature has no Team ID."
            exit 1
          fi

          echo "=== Validating stapler ticket on DMG ==="
          xcrun stapler validate "$dmg_path"

          echo "=== Gatekeeper assessment for DMG ==="
          spctl --assess \
            --type open \
            --context context:primary-signature \
            --verbose=4 \
            "$dmg_path"

      # ── Verify the application inside the final DMG ───────────────────────────
      - name: Verify application inside DMG
        run: |
          set -euo pipefail
          shopt -s nullglob

          dmg_files=(
            "target/${{ matrix.target }}/release/bundle/dmg/"*.dmg
            "src-tauri/target/${{ matrix.target }}/release/bundle/dmg/"*.dmg
          )
          if (( ${#dmg_files[@]} == 0 )); then
            echo "::error::No DMG files found."
            exit 1
          fi
          dmg_path="${dmg_files[0]}"

          mount_path="$(mktemp -d)"

          cleanup() {
            hdiutil detach "$mount_path" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          hdiutil attach "$dmg_path" \
            -readonly \
            -nobrowse \
            -mountpoint "$mount_path" \
            >/dev/null

          mounted_apps=(
            "$mount_path/"*.app
            "$mount_path/"*/*.app
          )
          if (( ${#mounted_apps[@]} == 0 )); then
            echo "::error::Could not locate .app bundle inside mounted DMG."
            exit 1
          fi
          mounted_app="${mounted_apps[0]}"
          echo "Found mounted app at: $mounted_app"

          echo "=== Verifying mounted .app code signature ==="
          codesign --verify \
            --deep \
            --strict \
            --verbose=2 \
            "$mounted_app"

          hdiutil detach "$mount_path" >/dev/null
          trap - EXIT

      # Sign final bytes after all notarization/stapling and canonical naming.
      - name: Sign and upload final macOS installers
        if: env.QUALIFICATION_ONLY != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OMERA_UPDATE_SIGNING_KEY: ${{ secrets.OMERA_UPDATE_SIGNING_KEY }}
          OMERA_UPDATE_SIGNING_PASSWORD: ${{ secrets.OMERA_UPDATE_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          node scripts/release-update-assets.mjs upload \
            "${{ matrix.target }}" "$RUNNER_TEMP/${{ matrix.dmg_asset_name }}"

      - name: Sign and verify final qualification installers
        if: env.QUALIFICATION_ONLY == 'true'
        env:
          OMERA_UPDATE_SIGNING_KEY: ${{ secrets.OMERA_UPDATE_SIGNING_KEY }}
          OMERA_UPDATE_SIGNING_PASSWORD: ${{ secrets.OMERA_UPDATE_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          node scripts/release-update-assets.mjs qualify \
            "${{ matrix.target }}" "$RUNNER_TEMP/${{ matrix.dmg_asset_name }}"
          shasum -a 256 "$RUNNER_TEMP/${{ matrix.dmg_asset_name }}"

      - name: Preserve notarized macOS qualification installer
        if: env.QUALIFICATION_ONLY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: notarized-macos-aarch64-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ runner.temp }}/${{ matrix.dmg_asset_name }}
            ${{ runner.temp }}/${{ matrix.dmg_asset_name }}.minisig

  # ── Windows & Linux: no code-signing changes ─────────────────────────────────
  build-other:
    if: github.event_name != 'workflow_dispatch' || !inputs.qualification_only
    name: Build ${{ matrix.os_name }} (${{ matrix.arch_name }})
    needs: release-preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            os_name: 'Windows'
            arch_name: 'x64'
          - platform: 'ubuntu-latest'
            target: 'x86_64-unknown-linux-gnu'
            os_name: 'Linux'
            arch_name: 'x64'

    runs-on: ${{ matrix.platform }}

    env:
      OMERA_UPDATE_PUBLIC_KEY: ${{ vars.OMERA_UPDATE_PUBLIC_KEY }}
      RELEASE_TAG: >-
        ${{ github.event_name == 'workflow_dispatch'
            && inputs.tag_name
            || github.ref_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.os_name == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsoup-3.0-dev \
            libssl-dev

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate embedded trust and signing custody
        shell: bash
        env:
          OMERA_UPDATE_SIGNING_KEY: ${{ secrets.OMERA_UPDATE_SIGNING_KEY }}
          OMERA_UPDATE_SIGNING_PASSWORD: ${{ secrets.OMERA_UPDATE_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          node scripts/update-signing.mjs check
          pnpm build
          cargo build -p omera --bin verify-update
          node scripts/update-signing.mjs preflight

      - name: Build Tauri application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: 'Omera ${{ env.RELEASE_TAG }}'
          releaseBody: 'See [CHANGELOG.md](CHANGELOG.md) for full release details.'
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

      - name: Sign and upload platform installers
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OMERA_UPDATE_SIGNING_KEY: ${{ secrets.OMERA_UPDATE_SIGNING_KEY }}
          OMERA_UPDATE_SIGNING_PASSWORD: ${{ secrets.OMERA_UPDATE_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          node scripts/release-update-assets.mjs upload "${{ matrix.target }}"

      - name: Preserve production verifier for publication gate
        if: matrix.os_name == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: release-update-verifier
          path: target/debug/verify-update
          if-no-files-found: error
          retention-days: 1

  # ── Promote draft to published once every platform passes ────────────────────
  publish-release:
    if: github.event_name != 'workflow_dispatch' || !inputs.qualification_only
    name: Publish release
    needs:
      - build-macos
      - build-other

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js for publication verification
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download production verifier
        uses: actions/download-artifact@v4
        with:
          name: release-update-verifier
          path: target/debug

      - name: Verify every draft installer before publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OMERA_UPDATE_PUBLIC_KEY: ${{ vars.OMERA_UPDATE_PUBLIC_KEY }}
          RELEASE_TAG: >-
            ${{ github.event_name == 'workflow_dispatch'
                && inputs.tag_name
                || github.ref_name }}
        run: |
          set -euo pipefail
          node scripts/release-preflight.mjs draft
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-0 libayatana-appindicator3-1
          chmod +x target/debug/verify-update
          gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/signed-release" --repo "$GITHUB_REPOSITORY"
          node scripts/release-update-assets.mjs verify "$RUNNER_TEMP/signed-release"

      - name: Extract release notes from CHANGELOG.md
        env:
          RELEASE_TAG: >-
            ${{ github.event_name == 'workflow_dispatch'
                && inputs.tag_name
                || github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 { found=1; next }
            found && ($0 ~ "^---" || index($0, "## [") == 1) { found=0; exit }
            found { print }
          ' CHANGELOG.md > release_notes.md

          if [ -s release_notes.md ]; then
            echo "" >> release_notes.md
            echo "---" >> release_notes.md
            echo "For complete release details and commit history, see [CHANGELOG.md](CHANGELOG.md)." >> release_notes.md
          else
            echo "See [CHANGELOG.md](CHANGELOG.md) for full release details." > release_notes.md
          fi

      - name: Promote draft release to published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: >-
            ${{ github.event_name == 'workflow_dispatch'
                && inputs.tag_name
                || github.ref_name }}
        run: |
          set -euo pipefail
          node scripts/release-preflight.mjs draft
          gh release edit "$RELEASE_TAG" \
            --notes-file release_notes.md \
            --draft=false \
            --repo "$GITHUB_REPOSITORY"
