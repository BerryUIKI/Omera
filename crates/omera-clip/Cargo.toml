[package]
name = "omera-clip"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Local CLIP/SigLIP multi-modal embedding and text-to-image semantic search for Omera"

[dependencies]
omera-domain = { path = "../omera-domain" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
# `ort`'s default feature set includes `copy-dylibs`, whose Windows branch
# symlinks the ONNX Runtime DLLs into the cargo target directory and falls back
# to `fs::copy` when symlinking is denied. On hosted Windows runners that
# fallback panics with `Os { code: 3 }` because the destination path does not
# exist, failing every build before compilation starts. Nothing here bundles
# those DLLs -- the release build copies them itself -- so the feature is
# dropped by taking the default set apart and naming what is used.
ort = { version = "2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "tracing", "download-binaries", "tls-native", "api-27"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }

[dev-dependencies]
tempfile = "3"
